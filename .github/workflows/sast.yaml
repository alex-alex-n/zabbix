# Название рабочего процесса (workflow), которое будет отображаться в интерфейсе GitHub Actions.
# запуск статического анализа безопасности (SAST).
name: SAST Security Scan

# Блок определения триггеров (событий), при которых GitHub Actions будет запускать данный workflow.
# Это позволяет автоматизировать проверку безопасности при изменениях кода и по расписанию.
on:
  # Триггер запуска при выполнении операции push (отправка коммитов) в указанные ветки.
  push:
    # Список веток, для которых будет срабатывать триггер push.
    branches: [ master, main, develop ]
  # Триггер запуска при создании или обновлении pull request в указанные ветки.
  pull_request:
    # Список целевых веток, в которые создаются pull request’ы и для которых будет запускаться проверка.
    branches: [ master, main ]
  # Триггер запуска по расписанию (cron).
  # Позволяет регулярно запускать SAST-проверки, даже если изменений в коде не было.
  schedule:
    # Расписание в формате cron: '0 0 * * 0' — каждое воскресенье в 00:00 по UTC.
    - cron: '0 0 * * 0'

# Настройка прав доступа (permissions) для автоматически создаваемого токена GITHUB_TOKEN,
# который используется внутри workflow для взаимодействия с репозиторием.
permissions:
  # Разрешаем только чтение содержимого репозитория.
  contents: read

# Основной блок определения заданий (jobs), которые будут выполняться в рамках данного workflow.
# Каждый job запускается в отдельной виртуальной машине (runner) и может выполняться параллельно.
jobs:
  # Задание для выполнения статического анализа PHP-кода.
  # Включает запуск PHPStan и Psalm — популярных инструментов анализа качества и безопасности PHP.
  sast-php:
    # Отдельное человеко-читаемое имя задания, отображаемое в GitHub Actions.
    name: SAST PHP (PHPStan & Psalm)
    # Указываем тип виртуальной машины, на которой будет выполняться задание — последняя доступная Ubuntu.
    runs-on: ubuntu-latest
    # Значения по умолчанию для всех шагов (steps) внутри данного задания.
    defaults:
      run:
        # Явно указываем, что все shell-команды нужно выполнять в оболочке bash.
        shell: bash
    # Последовательность шагов, которые будут поочередно выполняться в рамках задания SAST PHP.
    steps:
      # Шаг 1: Получение (checkout) кода репозитория в рабочую директорию runner’а.
      # Это необходимо, чтобы анализаторы могли просканировать исходный код проекта.
      - uses: actions/checkout@v4

      # Шаг 2: Настройка PHP-среды, необходимой для запуска статического анализа.
      # Здесь устанавливается нужная версия PHP и необходимые инструменты (composer, phpstan, psalm).
      - name: Setup PHP
        # Используем внешний GitHub Action, который автоматически устанавливает и настраивает PHP.
        uses: shivammathur/setup-php@v2
        with:
          # Версия PHP, которая будет установлена (в данном случае 8.2).
          php-version: '8.2'
          # Отключаем установку и сбор покрытия кода, так как здесь нас интересует только SAST.
          coverage: none
          # Список дополнительных инструментов, которые будут установлены вместе с PHP.
          # composer — менеджер зависимостей PHP,
          # phpstan — статический анализатор PHP,
          # psalm — статический и безопасностный анализатор PHP.
          tools: composer, phpstan, psalm

          # Шаг 3: Установка PHP-зависимостей для фронтенд-части (директория ui), если там есть composer.json.
      - name: Install UI PHP dependencies (if composer.json exists)
        # Указываем рабочую директорию для команд данного шага — папка ui (например, веб-интерфейс).
        working-directory: ui
        # Непосредственно исполняемые команды для установки зависимостей.
        run: |
          # Проверяем, существует ли файл composer.json в директории ui.
          if [ -f composer.json ]; then
            # Если файл найден, запускаем установку зависимостей через composer.
            # Параметры:
            # --no-interaction — без интерактивных вопросов,
            # --no-progress — без лишнего прогресс-бара,
            # --prefer-dist — приоритет скачивания архивов вместо репозиториев.
            composer install --no-interaction --no-progress --prefer-dist
          else
            # Если composer.json отсутствует, выводим информационное сообщение и пропускаем установку.
            echo "ui/composer.json not found, skipping composer install"
          fi

      # Шаг 4: Создание отдельного конфигурационного файла Psalm для CI-среды.
      # Это позволяет ограничить анализ нужными директориями и избежать ошибок из временных или служебных папок.
      - name: Create CI psalm config (avoid missing dirs like node_modules)
        # Все команды шага выполняются в директории ui.
        working-directory: ui
        run: |
          # Создаём файл psalm-ci.xml с помощью here-document.
          # Этот файл будет использоваться Psalm в рамках CI-проверки.
          cat > psalm-ci.xml <<'XML'
          <?xml version="1.0"?>
          <psalm
            errorLevel="4"
            resolveFromConfigFile="true"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:noNamespaceSchemaLocation="vendor/vimeo/psalm/config.xsd"
          >
            <projectFiles>
              <!-- Указываем, что анализу подлежит текущая директория (.) и её поддиректории -->
              <directory name="."/>
              <ignoreFiles>
                <!-- Исключаем директорию vendor, где находятся сторонние библиотеки,
                     чтобы не анализировать чужой код и ускорить проверку -->
                <directory name="vendor"/>
              </ignoreFiles>
            </projectFiles>
          </psalm>
          XML

      # Шаг 5: Запуск PHPStan — статического анализатора PHP-кода.
      # Инструмент проверяет код на типовые ошибки, потенциальные уязвимости и нарушения типизации.
      - name: Run PHPStan (Static Analysis)
        # Выполняем команды в директории ui, где находится PHP-код веб-интерфейса.
        working-directory: ui
        run: |
          # Создаём (при необходимости) директорию для вывода результатов SAST-анализа на уровень выше (../sast-out).
          mkdir -p ../sast-out
          # Инициализируем переменную, в которой будут перечислены директории для анализа.
          TARGETS=""
          # Если существует директория app, добавляем её в список целей анализа.
          [ -d app ] && TARGETS="$TARGETS app"
          # Если существует директория classes, также добавляем её.
          [ -d classes ] && TARGETS="$TARGETS classes"
          # Если существует директория include, добавляем и её.
          [ -d include ] && TARGETS="$TARGETS include"
          # Если ни одна из указанных директорий не существует, анализируем всю текущую директорию (.)
          [ -z "$TARGETS" ] && TARGETS="."
          # Запускаем phpstan с заданным уровнем строгости и форматом вывода.
          # --level=8 — высокий (строгий) уровень проверки,
          # --no-progress — без прогресс-бара,
          # --error-format=github — формат сообщений, понятный GitHub (аннотации к коду).
          # Результат перенаправляем в файл ../sast-out/phpstan-results.txt.
          # '|| true' позволяет не прерывать workflow при ненулевом коде выхода (ошибках анализа),
          # чтобы отчёт всё равно был сохранён как артефакт, а pipeline не падал жёстко.
          phpstan analyse $TARGETS --level=8 --no-progress --error-format=github \
            > ../sast-out/phpstan-results.txt || true

      # Шаг 6: Запуск Psalm — статического и безопасностного анализатора PHP-кода.
      # Psalm дополняет PHPStan и позволяет выявлять дополнительные проблемы, включая потенциальные уязвимости.
      - name: Run Psalm (Static/Security Analysis)
        # Все команды выполняются в директории ui.
        working-directory: ui
        run: |
          # Создаём (если нет) директорию для результатов анализа на уровень выше.
          mkdir -p ../sast-out
          # Запускаем Psalm с использованием ранее созданного конфигурационного файла psalm-ci.xml.
          # --stats — вывод статистики по анализу,
          # --output-format=github — формат вывода, совместимый с аннотациями GitHub.
          # Результат записываем в ../sast-out/psalm-results.txt.
          # '|| true' — не прерываем workflow при обнаружении ошибок, а только фиксируем их в отчёте.
          psalm --config=psalm-ci.xml --stats --output-format=github \
            > ../sast-out/psalm-results.txt || true

      # Шаг 7: Загрузка (upload) результатов анализа PHP в виде артефактов GitHub Actions.
      # Это позволяет просматривать отчёты после завершения выполнения workflow.
      - name: Upload PHP results
        # Используем официальный экшен для загрузки артефактов.
        uses: actions/upload-artifact@v4
        with:
          # Имя набора артефактов, под которым он будет отображаться в интерфейсе.
          name: sast-php-results
          # Пути к файлам отчётов, которые необходимо сохранить как артефакты.
          path: |
            sast-out/phpstan-results.txt
            sast-out/psalm-results.txt

  # Задание для выполнения статического анализа C/C++ кода.
  # В качестве инструмента используется Cppcheck, который выявляет ошибки и возможные уязвимости.
  sast-c:
    # Человеко-читаемое имя задания для интерфейса GitHub Actions.
    name: SAST C/C++ (Cppcheck)
    # Тип виртуальной машины — последняя версия Ubuntu.
    runs-on: ubuntu-latest
    # Настройки по умолчанию для shell-команд внутри данного задания.
    defaults:
      run:
        shell: bash
    # Набор шагов, определяющих логику выполнения анализа C/C++ кода.
    steps:
      # Шаг 1: Получение кода репозитория (обязательный шаг перед анализом).
      - uses: actions/checkout@v4

      # Шаг 2: Установка инструмента Cppcheck в среду выполнения.
      # Cppcheck не установлен по умолчанию, поэтому его нужно установить через пакетный менеджер.
      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Шаг 3: Запуск статического анализа C/C++ кода с помощью Cppcheck.
      - name: Run Cppcheck Analysis
        run: |
          # Создаём директорию для вывода результатов анализа.
          mkdir -p sast-out
          # Запускаем Cppcheck с максимальным набором проверок.
          # --enable=all — включает все доступные проверки,
          # --suppress=missingIncludeSystem — подавляет предупреждения о системных заголовках,
          # --inline-suppr — позволяет использовать встроенные подавления в коде,
          # --error-exitcode=0 — всегда возвращает код выхода 0 (не прерывает workflow при найденных ошибках).
          # Анализ проводится для директории src/.
          # Стандартный поток ошибок (где Cppcheck выводит результаты) перенаправляем в файл отчёта.
          # '|| true' — дополнительная защита от прерывания шага при ошибках запуска.
          cppcheck --enable=all --suppress=missingIncludeSystem \
                   --inline-suppr --error-exitcode=0 \
                   src/ 2> sast-out/cppcheck-results.txt || true

      # Шаг 4: Загрузка результатов анализа C/C++ в виде артефактов.
      - name: Upload C results
        uses: actions/upload-artifact@v4
        with:
          # Имя набора артефактов для C/C++ анализа.
          name: sast-c-results
          # Путь к файлу с результатами Cppcheck.
          path: sast-out/cppcheck-results.txt

  # Задание для выполнения статического анализа Go-кода.
  # В качестве инструмента используется Gosec — специализированный анализатор безопасности для Go.
  sast-go:
    # Имя задания, отображаемое в GitHub Actions.
    name: SAST Go (Gosec)
    # Тип виртуальной машины — Ubuntu.
    runs-on: ubuntu-latest
    # Настройки оболочки по умолчанию для всех шагов.
    defaults:
      run:
        shell: bash
    # Описание последовательности шагов для анализа Go-кода.
    steps:
      # Шаг 1: Получение исходного кода репозитория.
      - uses: actions/checkout@v4

      # Шаг 2: Настройка Go-среды нужной версии.
      # Необходима для установки и запуска утилиты Gosec.
      - name: Setup Go
        # Используем официальный GitHub Action для установки Go.
        uses: actions/setup-go@v5
        with:
          # Версия Go, которая будет установлена (1.21).
          go-version: '1.21'

      # Шаг 3: Установка утилиты Gosec в GOPATH/bin.
      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # Шаг 4: Запуск анализа Gosec для всех найденных Go-модулей (по файлам go.mod).
      - name: Run Gosec Analysis
        run: |
          # Создаём директорию для результатов анализа.
          mkdir -p sast-out
          # Очищаем или создаём файл отчёта gosec-results.txt.
          : > sast-out/gosec-results.txt
          # Ищем все файлы go.mod в репозитории, получаем директории, сортируем и удаляем дубликаты.
          # Для каждой такой директории будет выполнен отдельный запуск Gosec.
          while IFS= read -r dir; do
            # Пишем в отчёт, какой модуль сейчас анализируется.
            echo "Analyzing Go module in $dir" | tee -a sast-out/gosec-results.txt
            # Переходим в директорию модуля и запускаем Gosec для всех пакетов (./...).
            # Вывод (stdout и stderr) добавляем в общий файл отчёта.
            # '|| true' не даёт прервать выполнение при ошибках анализа.
            ( cd "$dir" && "$HOME/go/bin/gosec" ./... ) 2>&1 | tee -a sast-out/gosec-results.txt || true
            # Добавляем пустую строку между результатами разных модулей для удобства чтения.
            echo "" >> sast-out/gosec-results.txt
          # Читаем список директорий модулей из вывода команды find.
          done < <(find . -name "go.mod" -exec dirname {} \; | sort -u)

      # Шаг 5: Загрузка результатов анализа Go в виде артефакта.
      - name: Upload Go results
        uses: actions/upload-artifact@v4
        with:
          # Имя набора артефактов для Go-анализа.
          name: sast-go-results
          # Путь к файлу отчёта Gosec.
          path: sast-out/gosec-results.txt

  # Задание для выполнения статического анализа JavaScript-кода.
  # Используется ESLint с плагином безопасности для выявления типичных JS-уязвимостей.
  sast-js:
    # Имя задания для интерфейса GitHub Actions.
    name: SAST JavaScript (ESLint)
    # Виртуальная машина с Ubuntu.
    runs-on: ubuntu-latest
    # Настройки оболочки по умолчанию.
    defaults:
      run:
        shell: bash
    # Шаги выполнения анализа JavaScript-кода.
    steps:
      # Шаг 1: Получение кода репозитория.
      - uses: actions/checkout@v4

      # Шаг 2: Настройка среды Node.js требуемой версии.
      # Необходима для установки и запуска ESLint и его плагинов.
      - name: Setup Node.js
        # Используем официальный GitHub Action для установки Node.js.
        uses: actions/setup-node@v4
        with:
          # Версия Node.js, которая будет установлена (18).
          node-version: '18'

      # Шаг 3: Установка ESLint и плагина безопасности eslint-plugin-security.
      # Эти инструменты позволяют находить потенциальные уязвимости в JavaScript-коде.
      - name: Install ESLint + security plugin
        run: |
          # Инициализируем минимальный npm-проект (создаётся package.json).
          npm init -y
          # Устанавливаем ESLint и плагин безопасности как dev-зависимости.
          npm install eslint eslint-plugin-security --save-dev

      # Шаг 4: Создание минимальной конфигурации ESLint с включёнными правилами безопасности.
      - name: Create minimal ESLint config
        run: |
          # Создаём файл .eslintrc.json с помощью here-document.
          # В конфигурации подключаем плагин security и включаем ряд правил,
          # направленных на обнаружение опасных конструкций в коде.
          cat > .eslintrc.json <<'JSON'
          {
            "plugins": ["security"],
            "rules": {
              "security/detect-object-injection": "error",
              "security/detect-eval-with-expression": "error",
              "security/detect-non-literal-require": "error",
              "security/detect-unsafe-regex": "error"
            }
          }
          JSON

      # Шаг 5: Запуск ESLint с включёнными правилами безопасности для JavaScript-файлов проекта.
      - name: Run ESLint security analysis
        run: |
          # Создаём директорию для результатов анализа.
          mkdir -p sast-out
          # Запускаем ESLint для всех JS-файлов в каталоге ui/assets/js и его подкаталогах.
          # --format=json — вывод в формате JSON, удобном для последующей обработки.
          # Результат сохраняем в файл sast-out/eslint-results.json.
          # Перенаправление 2>/dev/null скрывает лишние предупреждения,
          # а '|| true' предотвращает прерывание workflow при найденных ошибках.
          npx eslint "ui/assets/js/**/*.js" --format=json > sast-out/eslint-results.json 2>/dev/null || true

      # Шаг 6: Загрузка результатов анализа JavaScript в виде артефакта.
      - name: Upload JavaScript results
        uses: actions/upload-artifact@v4
        with:
          # Имя набора артефактов для JS-анализа.
          name: sast-js-results
          # Путь к JSON-файлу отчёта ESLint.
          path: sast-out/eslint-results.json

  # Задание для генерации итогового сводного отчёта по всем выполненным SAST-проверкам.
  # Это задание собирает результаты из предыдущих job’ов и формирует человеко-читаемый HTML-отчёт.
  generate-report:
    # Имя задания, отображаемое в GitHub Actions.
    name: Generate Summary Report
    # Тип виртуальной машины — Ubuntu.
    runs-on: ubuntu-latest
    # Указываем, что данное задание зависит от завершения всех SAST-заданий.
    # Это гарантирует, что отчёт будет формироваться только после того, как будут доступны все артефакты.
    needs: [sast-php, sast-c, sast-go, sast-js]
    # Условие запуска: always() — задание выполняется даже в том случае,
    # если одно или несколько зависимых заданий завершились с ошибкой.
    if: always()
    # Настройки оболочки по умолчанию.
    defaults:
      run:
        shell: bash
    # Шаги формирования и публикации сводного отчёта.
    steps:
      # Шаг 1: Загрузка всех артефактов с результатами SAST-анализа из предыдущих заданий.
      - name: Download all SAST results
        # Используем официальный экшен для скачивания артефактов.
        uses: actions/download-artifact@v4
        with:
          # Локальный путь, в который будут загружены все артефакты.
          # Внутри этой директории будут созданы подпапки по именам артефактов.
          path: artifacts

      # Шаг 2: Создание HTML-файла с кратким сводным отчётом по результатам всех анализаторов.
      - name: Create HTML summary
        run: |
          # Имя выходного HTML-файла, который будет содержать сводный отчёт.
          OUT="sast-summary.html"
          # Начало HTML-документа: открывающие теги и заголовок.
          echo "<html><body><h1>SAST Results Summary</h1>" > "$OUT"
          # Добавляем информацию о времени генерации отчёта (в формате UTC).
          echo "<p>Generated on $(date -u)</p>" >> "$OUT"

          # Блок отчёта по анализу PHP-кода.
          echo "<h2>PHP Analysis</h2>" >> "$OUT"
          # Если файл с результатами PHPStan был найден среди артефактов, добавляем его фрагмент в отчёт.
          if [ -f "artifacts/sast-php-results/phpstan-results.txt" ]; then
            # Заголовок для блока PHPStan и открытие тега <pre> для форматированного текста.
            echo "<h3>PHPStan (last 50 lines)</h3><pre>" >> "$OUT"
            # Добавляем в отчёт последние 50 строк файла phpstan-results.txt,
            # чтобы показать наиболее свежие и важные сообщения.
            tail -50 "artifacts/sast-php-results/phpstan-results.txt" >> "$OUT"
            # Закрываем тег <pre>.
            echo "</pre>" >> "$OUT"
          else
            # Если файл результатов отсутствует, выводим соответствующее уведомление.
            echo "<p>PHPStan results not found</p>" >> "$OUT"
          fi

          # Аналогично проверяем наличие и добавляем фрагмент отчёта для Psalm.
          if [ -f "artifacts/sast-php-results/psalm-results.txt" ]; then
            # Заголовок для блока Psalm и открытие форматированного вывода.
            echo "<h3>Psalm (last 50 lines)</h3><pre>" >> "$OUT"
            # Добавляем последние 50 строк отчёта Psalm.
            tail -50 "artifacts/sast-php-results/psalm-results.txt" >> "$OUT"
            # Закрываем тег <pre>.
            echo "</pre>" >> "$OUT"
          else
            # Сообщаем, что результаты Psalm не были найдены.
            echo "<p>Psalm results not found</p>" >> "$OUT"
          fi

          # Блок отчёта по анализу C/C++ кода.
          echo "<h2>C/C++ Analysis</h2>" >> "$OUT"
          # Проверяем, существует ли файл с результатами Cppcheck.
          if [ -f "artifacts/sast-c-results/cppcheck-results.txt" ]; then
            # Заголовок и описание для блока Cppcheck.
            echo "<h3>Cppcheck (first 30 warnings/errors)</h3><pre>" >> "$OUT"
            # Извлекаем только строки, содержащие слова "error" или "warning",
            # и берём первые 30 таких записей для краткого обзора.
            grep -E "(error|warning)" "artifacts/sast-c-results/cppcheck-results.txt" | head -30 >> "$OUT" || true
            # Закрываем тег <pre>.
            echo "</pre>" >> "$OUT"
          else
            # Если отчёт Cppcheck отсутствует, выводим уведомление.
            echo "<p>Cppcheck results not found</p>" >> "$OUT"
          fi

          # Блок отчёта по анализу Go-кода.
          echo "<h2>Go Analysis</h2>" >> "$OUT"
          # Проверяем наличие файла с результатами Gosec.
          if [ -f "artifacts/sast-go-results/gosec-results.txt" ]; then
            # Заголовок для блока Gosec и открытие форматированного вывода.
            echo "<h3>Gosec (last 80 lines)</h3><pre>" >> "$OUT"
            # Добавляем последние 80 строк отчёта Gosec, чтобы отобразить ключевые найденные проблемы.
            tail -80 "artifacts/sast-go-results/gosec-results.txt" >> "$OUT"
            # Закрываем тег <pre>.
            echo "</pre>" >> "$OUT"
          else
            # Уведомление об отсутствии результатов Gosec.
            echo "<p>Gosec results not found</p>" >> "$OUT"
          fi

          # Блок отчёта по анализу JavaScript-кода.
          echo "<h2>JavaScript Analysis</h2>" >> "$OUT"
          # Проверяем, существует ли JSON-файл с результатами ESLint.
          if [ -f "artifacts/sast-js-results/eslint-results.json" ]; then
            # В данном упрощённом отчёте мы только сообщаем о наличии JSON-файла,
            # полный анализ можно выполнить отдельно, используя сохранённый артефакт.
            echo "<p>ESLint JSON saved as artifact (see artifacts).</p>" >> "$OUT"
          else
            # Сообщаем, что результаты ESLint не найдены.
            echo "<p>ESLint results not found</p>" >> "$OUT"
          fi

          # Закрываем теги body и html, завершая формирование HTML-документа.
          echo "</body></html>" >> "$OUT"

      # Шаг 3: Загрузка итогового HTML-отчёта и всех ранее скачанных артефактов как одного набора.
      # Это позволяет удобно скачать и проанализировать все результаты SAST из одного места.
      - name: Upload final report + all artifacts bundle
        uses: actions/upload-artifact@v4
        with:
          # Имя набора артефактов, содержащего итоговый отчёт и все результаты сканирования.
          name: sast-final-report
          # Пути к файлам и директориям, которые нужно включить в данный артефакт:
          # сам HTML-отчёт и папка artifacts со всеми поддиректориями.
          path: |
            sast-summary.html
            artifacts/
